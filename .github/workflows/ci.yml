name: CI

on:
  push:
    branches:
      - dev
      - main
    paths-ignore:
      - LICENSE
      - README-cmn_CN.md
      - README-cmn_TW.md
      - docs/**

  pull_request:
    branches:
      - dev
      - main
    paths-ignore:
      - LICENSE
      - README-cmn_CN.md
      - README-cmn_TW.md
      - docs/**

jobs:
  test:
    name: Test
    strategy:
      matrix:
        os: [ubuntu-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: bun --bun run lint

      - name: Type check
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: bun --bun run typecheck

      - name: Knip
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: bun --bun run knip

      - name: Build Extension
        run: bun --bun run build

      - name: Upload Chrome Extension Zip
        if: ${{ matrix.os == 'ubuntu-latest' && github.ref_name == 'main' }}
        uses: actions/upload-artifact@v4.3.1
        with:
          name: BewlyNeko-chrome-extension
          path: extension

      - name: Build Firefox Extension
        run: bun --bun run build-firefox

      - name: Upload Firefox Extension Zip
        if: ${{ matrix.os == 'ubuntu-latest' && github.ref_name == 'main' }}
        uses: actions/upload-artifact@v4.3.1
        with:
          name: BewlyNeko-firefox-extension
          path: extension-firefox
